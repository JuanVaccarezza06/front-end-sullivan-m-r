<div class="form-container-zone" [formGroup]="form">
  @if (addZone) {
    <div class="form-grid">
      <div class="form-group">
        <label>Zona <span class="required">*</span></label>
        <input type="text" formControlName="zone" placeholder="Ej: Centro" />
        @if (form.get('zone')?.hasError('required') && form.get('zone')?.touched) {
          <p class="p-error">Requerido</p>
        }
      </div>

      <div class="form-group">
        <label>Ciudad <span class="required">*</span></label>
        <input type="text" formControlName="city" />
      </div>

      <div class="form-group">
        <label>Provincia <span class="required">*</span></label>
        <input type="text" formControlName="province" />
      </div>

      <div class="form-group">
        <label>País <span class="required">*</span></label>
        <input type="text" formControlName="country" />
      </div>
    </div>
  } @else {
    <div class="form-group">
      <label>Ubicación <span class="required">*</span></label>
      <select formControlName="selectedZone" [compareWith]="compareZones">
        <option [ngValue]="null">Seleccionar ubicación...</option>
        @for (z of zoneArray; track z.zoneName) {
          <option [ngValue]="z">{{ z.zoneName }}, {{ z.cityDTO.cityName }}</option>
        }
      </select>
      @if (form.get('selectedZone')?.hasError('required') && form.get('selectedZone')?.touched) {
        <p class="p-error">Debes seleccionar una zona</p>
      }
    </div>
  }

  <div class="form-group mt-2">
    <button type="button" class="toggle-button" (click)="toggleMode()">
      {{ addZone ? '← Elegir zona existente' : '+ Agregar nueva zona manualmente' }}
    </button>
  </div>
</div>
