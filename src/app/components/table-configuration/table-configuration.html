<div class="table-container">
    <table class="amenities-table"> <!-- Table body -->
        <thead> <!-- Header from table -->
            <tr>
                <th>Nombre</th> <!-- Header table items -->
                <th>Eliminar</th>
                <th>Destacado</th>
                <th>Ver usados</th>
            </tr>
        </thead>

        <tbody>

            @if(!items || items.length === 0){
            <tr>
                <td colspan="3">
                    <p>No hay items disponibles</p>
                </td>
            </tr>
            }

            @for (item of items; track $index) {
            <tr>
                <td class="col-name">{{item.itemName}}</td>
                <td class="col-name">
                    <button (click)="onDeleteItem(item)" class="icon-btn icon-delete">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </td>
                <td class="text-center">
                    <div class="toggle-switch">
                        <input type="checkbox" [id]="'toggle-' + $index" [checked]="item.isFeatured"
                            (change)="addIntoFeaturedArray(item, $event)">
                        <label [for]="'toggle-' + $index"></label>
                    </div>
                </td>
                <td>
                    <button (click)="onSeeItem(item)" class="icon-btn icon-view"
                        title="Ver propiedades con este filtro">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
