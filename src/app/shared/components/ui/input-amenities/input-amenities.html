<div class="amenities-section"> <h2 class="section-title">Amenities de la Propiedad</h2>

    <div class="inputs-container">
        <div class="input-group">
            <label class="input-label">Amenity Existente</label>
            <select class="amenity-select" [formControl]="amenityControlExisting">
                <option value="">Seleccionar...</option>
                @for (am of amenitiesArray; track am.amenityName) {
                    <option [value]="am.amenityName">{{ am.amenityName }}</option>
                }
            </select>
            <button class="add-button" type="button" (click)="addExistingAmenity()">Agregar</button>
        </div>

        <div class="input-group">
            <label class="input-label">Nueva Amenity</label>
            <input type="text" class="amenity-input" placeholder="Ej: Piscina Climatizada"
                [formControl]="amenityControlNew">
            <button class="add-button" type="button" (click)="addNewAmenity()">Crear y Agregar</button>
        </div>
    </div>

    <div class="amenities-list">
        @for (item of amenitiesLoad; track $index) {
            <div class="amenity-card">
                <span class="amenity-name">{{item.amenityName}}</span>
                <button class="delete-card-button" type="button" (click)="deleteAmenityFromArray(item.amenityName)">×</button>
            </div>
        }
    </div>
</div>
