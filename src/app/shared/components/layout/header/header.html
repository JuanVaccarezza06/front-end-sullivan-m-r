<header>
  <div class="header-inner">
    <div id="box-title" routerLink="/">
      <img id="logo" src="sullivan-mór-header.png" alt="logo" />
    </div>

    <nav>
      <div id="nav-box">
        <a class="link-nav" routerLink="/">Inicio</a>
        <a class="link-nav" routerLink="/properties">Propiedades</a>
        <a class="link-nav" routerLink="/services">Servicios</a>
        <a class="link-nav" routerLink="/about-us">Nosotros</a>
        <a class="link-nav" routerLink="/contact">Contacto</a>
      </div>
    </nav>

    <div id="image-box" class="relative">
      @if (isLogged()) {
        <button
          type="button"
          (click)="toggleMenu()"
          class="group flex items-center gap-3 p-1 pr-3 rounded-full hover:bg-gray-100 transition-all duration-200 focus:outline-none border border-transparent hover:border-gray-200 ml-4"
        >
          <div
            class="flex items-center justify-center w-10 h-10 rounded-full bg-green-700 text-white font-bold shadow-sm"
          >
            {{ userInitials }}
          </div>

          <div class="flex flex-col items-start text-left">
            <span
              class="text-sm font-semibold text-gray-800 group-hover:text-green-800 transition-colors leading-tight"
            >
              {{ userName }}
            </span>
            <span class="text-xs text-gray-500 font-medium"> Mi cuenta </span>
          </div>

          <i
            class="pi pi-chevron-down text-xs text-gray-400 group-hover:text-green-700 transition-colors mt-1"
          ></i>
        </button>

        @if (isMenuOpen) {
          <div class="fixed inset-0 z-[9998]" (click)="closeMenu()"></div>

          <div
            class="absolute right-0 top-full mt-4 w-72 bg-white rounded-lg shadow-2xl ring-1 ring-black ring-opacity-5 z-[9999] overflow-hidden animate-fade-in-down origin-top-right"
          >
            <div class="p-4 flex items-center gap-3 border-b border-gray-100 bg-gray-50">
              <div
                class="flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-green-700 text-white font-bold text-sm"
              >
                {{ userInitials }}
              </div>
              <div class="flex flex-col overflow-hidden">
                <span class="font-bold text-gray-900 text-sm truncate">{{ userName }}</span>
                <span class="text-xs text-gray-500 truncate">{{ userEmail }}</span>
              </div>
            </div>

            <div class="py-2 bg-white">
              @if (isAdmin()) {
                <a
                  [routerLink]="['/admin/dashboard']"
                  (click)="closeMenu()"
                  class="cursor-pointer flex items-center gap-3 px-4 py-3 text-sm font-semibold text-green-800 bg-green-50 hover:bg-green-100 transition-colors mb-1"
                >
                  <i class="pi pi-shield"></i> Panel de Administración
                </a>
              }

              <a
                (click)="goToProfile()"
                class="cursor-pointer flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors"
              >
                <i class="pi pi-user"></i> Mi Perfil
              </a>

              <a
                (click)="goToEditCredentials()"
                class="cursor-pointer flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors"
              >
                <i class="pi pi-cog"></i> Editar Credenciales
              </a>

              <a
                (click)="closeMenu()"
                class="cursor-pointer flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors"
              >
                <i class="pi pi-heart"></i> Propiedades Favoritas
              </a>

              <a
                (click)="closeMenu()"
                class="cursor-pointer flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors"
              >
                <i class="pi pi-home"></i> Mis Consultas
              </a>
            </div>

            <div class="border-t border-gray-100 py-1 bg-gray-50">
              <a
                (click)="logOut()"
                class="cursor-pointer flex items-center gap-3 px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition-colors font-medium"
              >
                <i class="pi pi-sign-out"></i> Cerrar Sesión
              </a>
            </div>
          </div>
        }
      } @else {
        <button type="button" class="cta" routerLink="/auth/login">Iniciar sesión</button>
        <button type="button" class="cta" routerLink="/auth/register">Registrarse</button>
      }
    </div>
  </div>
</header>
